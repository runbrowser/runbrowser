name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node is here for pnpm and for the extension's Vite build. Nothing that
      # ships runs on it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # The extension imports protocol types from the CLI package. Building it
      # is what catches the two drifting apart.
      - name: Build extension
        run: pnpm run build

      # Compiling is the only check that exercises the shipped artifact: a
      # runtime read of a file that is not on disk inside the binary passes
      # every test above and dies on first run.
      - name: Compile binaries
        run: bun scripts/build-binaries.ts

      - name: Smoke-test the binary
        run: |
          ./dist-npm/browser-linux-x64/termio-browser --version
          ./dist-npm/browser-linux-x64/termio-browser --help > /dev/null
          ./dist-npm/browser-linux-x64/termio-browser skill > /dev/null
