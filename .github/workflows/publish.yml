name: Publish to npm

# Publishing is manual for now.
#
# The tag trigger is deliberately absent: `packages/server` does not compile and
# session creation returns HTTP 400, so a `v*` tag would publish a CLI whose
# main verbs cannot work. Re-add
#
#   push:
#     tags: ['v*']
#
# once `pnpm run typecheck` passes and `runbrowser cdp` works against a browser.
#
# Packages are now @termio/*; the pre-rename @jiweiyuan/runbrowser* packages on
# npm are stale and should be deprecated pointing here once this publishes.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck before build so a compile failure stops the run here, with a
      # readable error, rather than surfacing as a broken artifact on npm. tsc
      # emits output even when it reports errors, so `build` alone is not a gate.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build all packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Publish @termio/browser-server
        run: pnpm --filter @termio/browser-server publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @termio/browser-mcp
        run: pnpm --filter @termio/browser-mcp publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @termio/browser
        run: pnpm --filter @termio/browser publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true
