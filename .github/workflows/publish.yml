name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Publish @jiweiyuan/runbrowser-server
        run: pnpm --filter @jiweiyuan/runbrowser-server publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @jiweiyuan/runbrowser-core
        run: pnpm --filter @jiweiyuan/runbrowser-core publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @jiweiyuan/runbrowser-mcp
        run: pnpm --filter @jiweiyuan/runbrowser-mcp publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @jiweiyuan/runbrowser
        run: pnpm --filter @jiweiyuan/runbrowser publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true
