name: Publish to npm

# Publishing is manual for now.
#
# The tag trigger is deliberately absent. `pnpm run typecheck` passes and the
# unit suite is green, but nothing here has driven a real Chrome through the
# relay since the Bun port. Re-add
#
#   push:
#     tags: ['v*']
#
# once `packages/e2e` runs green against a real browser, which is the only
# check that proves the relay still relays.
#
# One package ships: @termio/browser, carrying the CLI, the relay server and
# the MCP server. The pre-rename @jiweiyuan/runbrowser* packages on npm are
# stale and should be deprecated pointing here once this publishes.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Six packages ship: @termio/browser plus one per platform. All of them
    # publish with NPM_TOKEN, because npm's trusted publishing is configured on
    # a package's settings page and a package that has never been published has
    # no settings page. Once this has run once, each package can be switched to
    # trusted publishing and the secret dropped.
    permissions:
      contents: read
      id-token: write  # Lets npm attach a provenance attestation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node is here for pnpm and for the extension's Vite build. Nothing in
      # the published package runs on it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck first so a compile failure stops the run here, with a
      # readable error, rather than surfacing as a broken artifact on npm.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      # The extension is not published, but building it catches drift between
      # it and the package it imports protocol types from.
      - name: Build extension
        run: pnpm run build

      # Bun cross-compiles every target from this one runner, so there is no
      # matrix here.
      - name: Build platform binaries
        run: bun scripts/build-binaries.ts

      # Platform packages go first: they are optional dependencies of the main
      # package, so publishing that one first leaves a window where installing
      # it resolves nothing to run.
      - name: Publish platform packages
        run: |
          for directory in dist-npm/*/; do
            npm publish "$directory" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @termio/browser
        run: pnpm --filter @termio/browser publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
