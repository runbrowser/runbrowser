name: Release

# The file is named publish.yml because npm's trusted-publisher config binds
# to the workflow *filename*. Renaming it would break OIDC on every package.
#
# A release is a tag. Nothing in the repository is edited to cut one:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version. It is written into the manifest here, not committed,
# so there is no bump commit to forget and no way for the manifest and the tag
# to disagree.
#
# Before the first release, run scripts/first-publish.sh from a developer
# machine. Publishing here authenticates over OIDC, which npm configures on a
# package's settings page — and a package that has never been published does
# not have one. That bootstrap is one time; do not add a publish token to work
# around it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release and upload binaries
      id-token: write # authenticate to npm over OIDC, and sign provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node is here for pnpm and the extension's Vite build. Nothing that
      # ships runs on it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Refuse early and legibly. npm answers a duplicate version with a 403
      # that reads like a permissions problem.
      - name: Check the version is unpublished
        if: vars.NPM_PUBLISH == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          if npm view "runbrowser@$version" version >/dev/null 2>&1; then
            echo "runbrowser@$version is already on npm. Versions cannot be reused."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build extension
        run: pnpm run build

      - name: Write the version
        run: bun scripts/set-version.ts "${{ steps.version.outputs.version }}"

      # Bun cross-compiles every target from this one runner, so there is no
      # matrix here.
      - name: Build platform binaries
        run: bun scripts/build-binaries.ts

      # Running the artifact is the only check that covers it. A read of a file
      # that is not on disk inside the binary passes every test above and fails
      # on a user's first command.
      - name: Smoke-test the binary
        run: |
          ./dist-npm/runbrowser-linux-x64/runbrowser --version
          ./dist-npm/runbrowser-linux-x64/runbrowser --help > /dev/null
          ./dist-npm/runbrowser-linux-x64/runbrowser skill > /dev/null

      # npm is gated on a repository variable because the package is not
      # bootstrapped yet: trusted publishing is configured on a package's
      # settings page, and a package that has never been published has none.
      # Until scripts/first-publish.sh runs from a developer machine, these
      # steps fail — and failing here used to take the GitHub release down
      # with them, which is why v0.1.0 had to be built and uploaded by hand.
      # Set the NPM_PUBLISH variable to 'true' once the bootstrap is done.
      #
      # Platform packages first: they are optional dependencies of the main
      # package, so the other order leaves a window in which installing it
      # resolves nothing to run.
      - name: Publish platform packages
        if: vars.NPM_PUBLISH == 'true'
        run: |
          for directory in dist-npm/*/; do
            npm publish "$directory" --access public
          done
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish runbrowser
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish packages/browser --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      # The binaries are attached so a Homebrew formula or a curl installer has
      # somewhere to fetch from that is not npm.
      - name: Create the GitHub release
        run: |
          version="${{ steps.version.outputs.version }}"
          for directory in dist-npm/*/; do
            name=$(basename "$directory")
            tar czf "$name-$version.tar.gz" -C "$directory" .
          done
          # scripts/install.sh verifies against this before unpacking, and
          # treats a missing file as "skip verification" — so leaving it out
          # silently downgrades every install rather than failing one.
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes \
            ./*.tar.gz SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
