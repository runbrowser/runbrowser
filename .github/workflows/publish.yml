name: Publish to npm

# Publishing is manual for now.
#
# The tag trigger is deliberately absent. `pnpm run typecheck` passes and the
# unit suite is green, but nothing here has driven a real Chrome through the
# relay since the Bun port. Re-add
#
#   push:
#     tags: ['v*']
#
# once `packages/e2e` runs green against a real browser, which is the only
# check that proves the relay still relays.
#
# One package ships: @termio/browser, carrying the CLI, the relay server and
# the MCP server. The pre-rename @jiweiyuan/runbrowser* packages on npm are
# stale and should be deprecated pointing here once this publishes.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node is here for pnpm and for the extension's Vite build. Nothing in
      # the published package runs on it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck first so a compile failure stops the run here, with a
      # readable error, rather than surfacing as a broken artifact on npm.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      # The extension is not published, but building it catches drift between
      # it and the package it imports protocol types from.
      - name: Build extension
        run: pnpm run build

      - name: Publish @termio/browser
        run: pnpm --filter @termio/browser publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true
